# 1. GATILHO: Apenas tags
on:
  push:
    tags:
      - 'v*'

jobs:
  analise_codigo_e_seguranca:
    name: SonarCloud & Trivy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar precisa do historico completo

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar (gera target/classes para o Sonar)
        run: mvn -B clean verify

      # 2. ANALISE ESTATICA (SONAR)
      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 3. VERIFICACAO DE SEGURANCA (TRIVY) - dependencias e arquivos do repositorio
      - name: Trivy - scan do repositorio
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build_and_push_docker:
    name: Build e Push para Docker Hub
    needs: analise_codigo_e_seguranca # So roda se o job acima passar!
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/sistema-reengenheirado
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # Build local (sem push) para escanear a imagem antes de publicar
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. VERIFICACAO DE SEGURANCA (TRIVY) - imagem base (Corretto/Alpine)
      - name: Trivy - scan da imagem Docker
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.ref_name }}
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. PUSH (reaproveita o cache do build acima)
      - name: Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
